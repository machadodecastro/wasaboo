<!-- Tip Form -->
<div class="modal fade" id="updateEducation-{{c.id}}" tabindex="-1" role="dialog" 
     aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                       <span aria-hidden="true">&times;</span>
                       <span class="sr-only">Close</span>
                </button>
            </div>
            
            <div class="modal-body">
			
			<form id="update_education_form_{{c.id}}" action="{%url 'update_education' c.id %}" method="post">
			{% csrf_token %}
				  <input type="hidden" value="{{c.id}}" id="edit_idTip" class="idTip">
 			  	  
 			  	  <input type="hidden" value="{{user.id}}" id="education_user_id" name="education_user_id" 
 			  	  required="required" class="education_user_id">
 			   
	 			  <input type="hidden" value="{{perfil_logado.id}}" id="education_profile_id" 
	 			  name="education_profile_id" required="required" class="education_profile_id">
	 			  
	 			  <input type="hidden" value="{{perfil_logado.nome}}" id="education_name" 
	 			  name="education_name" required="required" class="education_name">
	 			  
	 			  <input id="edit_date" name="date" type="hidden"  value="{% now 'd/m/Y HH:mm:ss' %}" 
	 			  required="required" class="date">
	 			  
	 			  <span class="input_label">School / University</span>
	 			  <input type="text" id="edit_school_{{c.id}}" name="school" required="required" 
	 			  class="profile-field-normal school" placeholder="University of IT" value="{{c.school}}">
	 			  
	 			  <br/><br/>
	 			  
	 			  <span class="input_label">Course</span>
	 			  <input type="text" id="edit_course_{{c.id}}" name="course" 
	 			  class="profile-field-normal course" placeholder="Software engineering" value="{{c.course}}">

				  <br/><br/>
	 			  
	 			  <span class="input_label">Degree Type</span>
	 			  <input type="text" id="edit_degree_{{c.id}}" name="degree" 
	 			  class="profile-field-normal profile-field-small degree" placeholder="B.S." value="{{c.degree}}">	 

				  <br/><br/>
				  
				  <span class="input_label">Graduation Year</span>
				  <select id="edit_graduation_{{c.id}}" name="graduation" 
				  class="profile-field-normal profile-field-small">
				  	<option selected class="graduation_{{c.id}}"></option>
				  </select>
				  
				  <br/><br/><br/><br/>
				  
				  <div class="modal-header">	
				  <button type="button" class="btn btn-default btn-cancel" data-dismiss="modal">Close</button>
				  <input class="btn btn-info btn-update-education-{{c.id}}" type="submit" value="Update" disabled/>
				  </div>
			</form>	  
				  <script>
				  $(document).ready(function () {
					    if ($.trim($('#edit_school_{{c.id}}').val()).length > 1) {
				    		$('.btn-update-education-{{c.id}}').prop('disabled', false);
				    	}
					    $('#edit_school_{{c.id}}').keyup(function () {
					        if ($.trim($('#edit_school_{{c.id}}').val()).length < 1) {

					        	$('.btn-update-education-{{c.id}}').prop('disabled', true);

					        } else {

					        	$('.btn-update-education-{{c.id}}').prop('disabled', false);

					        }
					    });
				   });
		           </script>
            </div>
        </div>  
    </div>
</div>	<!-- End tip form -->


<script>
$(document).ready(function () {
	jQuery(document).ready(function($) {
        $('#edit_school_{{c.id}}').keyup(function(event) {
            var textBox = event.target;
            var start = textBox.selectionStart;
            var end = textBox.selectionEnd;
            textBox.value = textBox.value.charAt(0).toUpperCase() + textBox.value.slice(1);
            textBox.setSelectionRange(start, end);
        });
    });
});
$(document).ready(function () {
	jQuery(document).ready(function($) {
        $('#edit_course_{{c.id}}').keyup(function(event) {
            var textBox = event.target;
            var start = textBox.selectionStart;
            var end = textBox.selectionEnd;
            textBox.value = textBox.value.charAt(0).toUpperCase() + textBox.value.slice(1);
            textBox.setSelectionRange(start, end);
        });
    });
});
$(document).ready(function () {
	jQuery(document).ready(function($) {
        $('#edit_degree_{{c.id}}').keyup(function(event) {
            var textBox = event.target;
            var start = textBox.selectionStart;
            var end = textBox.selectionEnd;
            textBox.value = textBox.value.charAt(0).toUpperCase() + textBox.value.slice(1);
            textBox.setSelectionRange(start, end);
        });
    });
});
</script>	

<script>
  $(document).ready(function () {
   var start = 1900;
   var end = new Date().getFullYear();
   var option ="";
   var options = "";
   for(var year = start ; year <=end; year++){
      edit_option = "<option selected class='graduation_{{c.id}}' style='background-color:#93c4d3;color:#fff;'></option>";
      option = "<option selected value='{{c.graduation}}' style='background-color:#93c4d3;color:#fff;'>{{c.graduation}}</option>";
      options += "<option>"+ year +"</option>";
   }
   document.getElementById("edit_graduation_{{c.id}}").innerHTML = option + options;

  });
</script>	
		           
<!-- AJAX UPDATE EDUCATION FORM SUBMIT -->
	<script>
	$( document ).ready(function() {
	$("#update_education_form_{{c.id}}").submit(function(event){
	    event.preventDefault(); //prevent default action
	    var wasabooref = "{{url}}";   
	    var tip = $(this).data("id"); 
	    var post_url = $(this).attr("action"); //get form action url
	    var request_method = $(this).attr("method"); //get form GET/POST method
	    var form_data = new FormData(this); //Encode form elements for submission
	    
	    $(':input[type="submit"]').prop('disabled', true);
	    
	    $.ajax({
	    	url : post_url,
	        type: request_method,
	        data : form_data,
	        dataType : 'html',
	        contentType: false,
	        processData: false,
	        success: function(response) { //on success
	        	//LOAD SCRIPTS WITHOUT AJAX CALLS
	        	$.getScript( '/static/js/scripts-loader.js');
	        	
	            // AJAX CALLS
	        	$.getScript( '/static/js/show-references.js');
	        	$.getScript( '/static/js/show-back.js');
	        	$.getScript( '/static/js/favoriting-card.js');
	        	$.getScript( '/static/js/desfavoriting-card.js');
	        	$.getScript( '/static/js/hide-card.js');
	        	$.getScript( '/static/js/publish-card.js');
	        	$.getScript( '/static/js/counting-favoritings.js');
	        	$.getScript( '/static/js/who-favorited.js');
	        	$.getScript( '/static/js/delete-card-btn-yes.js');
	        	$.getScript( '/static/js/save-to-folder.js');
	        	$.getScript( '/static/js/delete-from-folder.js');
	        	$.getScript( '/static/js/jquery.jscroll.js');
	        	$.getScript( '/static/js/delete-education.js');
	        	
	        	// LOAD HTML
	        	$('.profile-waterfall').html(jQuery(response).find('.profile-waterfall').html());
	        	
	        	// CLOSE MODAL
	        	$('.close').click();
	        	$('body').removeClass('modal-open');
	        	$('.modal-backdrop').remove();	  
	        	$(':input[type="submit"]').prop('disabled', false);
	        }
	    });
	});
	});
	</script>
