{% load staticfiles %}
{% block body %}
<!DOCTYPE html>
<html lang="en">

  <head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Wasaboo is a free space where you can share your knowledgements through playing cards.">
    <meta name="author" content="Igor Machado de Castro">

    <title>Wasaboo</title>

    <!-- Bootstrap core CSS -->
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css'%}" rel="stylesheet">

    <!-- Custom fonts for this template -->
    <link href="{%static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet">
    <link href="{%static 'vendor/simple-line-icons/css/simple-line-icons.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,300italic,400italic,700italic" rel="stylesheet" type="text/css">

    <!-- Custom styles for this template -->
    <link href="{%static 'css/landing-page.min.css' %}" rel="stylesheet">    

	<script src="/static/js/jquery.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
	<style>
	  /* Make the image fully responsive */
	  .carousel-inner img {
		  width: 100%;
		  height: 100%;
	  }
	</style>

	<script async src="//pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
	<script>
	  (adsbygoogle = window.adsbygoogle || []).push({
		google_ad_client: "ca-pub-6545973381379182",
		enable_page_level_ads: true
	  });
	</script>
	
    <!--Google Search Console-->
    <meta name="google-site-verification" content="-LV_ElJ15XQBhGotiemoZKH6Bz8KzOCXrnRn7JoUR2I" />
  </head>

  <body>

    <!-- Navigation -->
   <nav class="navbar navbar-light static-top" style="background-color: #eee;">
      <div class="container">  
        <a class="navbar-brand" href="#">
        	<img src="{%static "img/wasaboo_logo.png" %}" style="width:60px;" alt="wasaboo">
			<img src="{%static "img/wasaboo_text.png" %}" alt="wasaboo">
		</a>
		<div style="float:right">
        <a class="btn btn-signin" href="{% url 'login' %}">Login</a>
        <a class="btn btn-signup" href="{% url 'registrar' %}">Sign Up</a>
        </div>
      </div>
    </nav>

    <!-- Masthead -->
    <header class="masthead text-white text-center">
      <div class="overlay"></div>
      <div class="container">
        <div class="row">
          <div class="col-md-10 col-lg-8 col-xl-7 mx-auto">
          
          <!-- Search bar -->	
		  <form method="get" action="/search/" class="autocomplete-me">
		  {% csrf_token %}
			  <div class="search-bar">
			    	<div id="imaginary_container"> 
			        	<div class="input-group stylish-input-group">
						    <input type="text" class="form-control" placeholder="Search..." 
						    id="autosearch" name="q" autocomplete="off" aria-label="Input search text">						    
						</div>
						<br/>
					    <span class="input-group-addon">
		                    <button type="submit" class="search-btn btn btn-signup" aria-label="Search" disabled>
		                    Search
		                    </button>  
			            </span>						
					</div>
			  </div>
		  </form>
		  <script>
		  $(document).ready(function () {
			    $('#autosearch').keyup(function () {
			        if ($.trim($('#autosearch').val()).length < 1) {
			        	$('.search-btn').prop('disabled', true);
			        } else {
			        	$('.search-btn').prop('disabled', false);
			        }
			    });	
		  });
		  </script>
		  <br/>
		  <br/>
		  <a class="home-card-link" href="{%url 'show_tip' 'outdoor' 854 %}">See this outdoor</a>
          </div>
        </div>
      </div>
    </header>

    <!-- Footer -->
    <footer class="footer bg-light">
      <div class="container">
        <div class="row">
          <div class="col-lg-8 h-100 text-center text-lg-left my-auto">
            <ul class="list-inline mb-2">              
              <li class="list-inline-item">
                <a href="{%url 'login' %}">Login</a>
              </li>
              <li class="list-inline-item">&sdot;</li>
              <li class="list-inline-item">
                <a href="{%url 'registrar' %}">Create an account</a>
              </li>
              <li class="list-inline-item">&sdot;</li>
              <li class="list-inline-item">
                <a href="{%url 'how_it_works' %}">How it works</a>
              </li>
            </ul>
            <p class="text-muted small mb-4 mb-lg-0">&copy; Wasaboo 2019. All Rights Reserved.</p>
          </div>
        </div>
      </div>
    </footer>

    <!-- Bootstrap core JavaScript -->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

  </body>

</html>
{% endblock %}
