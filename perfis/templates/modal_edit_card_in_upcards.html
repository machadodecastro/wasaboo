<script>
 $(document).ready(function () {
    $('.pencil-{{tip.id}}').on('click',function (){
    	var card = $(this).data("id");
    	var picture = $(this).data("upload");
    	if ($.trim($('#edit_content_'+card).val()).length < 1 && ($("#upload-drop-image-"+card).is(':visible') || $("#temporary-upload-drop-image-"+card).is(':visible'))) {
        	$('#submit-'+card).prop('disabled', true);
        } else {
			
        	$('#submit-'+card).prop('disabled', false);
        }


    $('.edit_content').on('keyup',function (){
    	var card = $(this).data("id");
    	if ($.trim($('#edit_content_'+card).val()).length < 1 && ($("#upload-drop-image-"+card).is(':visible') || $("#temporary-upload-drop-image-"+card).is(':visible'))) {
        	$('#submit-'+card).prop('disabled', true);
        } else {	
        	$('#submit-'+card).prop('disabled', false);
        }
    });
    
    $('.edit_content').keypress(function(event) {
        if (event.keyCode == 13) {
            event.preventDefault();
        }
    });
    
	  //##########################################################################
     		  // Return the first few bytes of the file as a hex string
 			  function getBLOBFileHeader(url, blob, callback) {
 			    var fileReader = new FileReader();
 			    fileReader.onloadend = function(e) {
 			      var arr = (new Uint8Array(e.target.result)).subarray(0, 4);
 			      var header = "";
 			      for (var i = 0; i < arr.length; i++) {
 			        header += arr[i].toString(16);
 			      }
 			      callback(url, header);
 			    };
 			    fileReader.readAsArrayBuffer(blob);
 			  }

 			  function getRemoteFileHeader(url, callback) {
 			    var xhr = new XMLHttpRequest();
 			    // Bypass CORS for this demo - naughty, Drakes
 			    xhr.open('GET', '//cors-anywhere.herokuapp.com/' + url);
 			    xhr.responseType = "blob";
 			    xhr.onload = function() {
 			      callback(url, xhr.response);
 			    };
 			    xhr.onerror = function() {
 			      alert('A network error occurred!');
 			    };
 			    xhr.send();
 			  }

 			  function headerCallback(url, headerString) {
 			    printHeaderInfo(url, headerString);
 			  }

 			  function remoteCallback(url, blob) {
 			    printImage(blob);
 			    getBLOBFileHeader(url, blob, headerCallback);
 			  }

 			  function printImage(blob) {
 			    // Add this image to the document body for proof of GET success
 			    var fr = new FileReader();
 			    fr.onloadend = function() {
 			    	$("#imgPreview-"+card).show(); 
 			    	$("#imgPreview-"+card).attr("src", fr.result).css('width', '200');
 			    	$(':input[type="submit"]').prop('disabled', false);
 			    	//$(".fr-image-upload-layer").append($("<img>").attr("src", fr.result).css('width', '300'))
 			        //.after($("<div>").text("Blob MIME type: " + blob.type));
			    	
 			    };
 			    fr.readAsDataURL(blob);
 			  }
 			  
 			  // Add more from http://en.wikipedia.org/wiki/List_of_file_signatures
 			  function mimeType(headerString) {
 			    switch (headerString) {
 			      case "89504e47":
 			        type = "image/png";
 			        $("#imgPreview-"+card).show();
			        $("#upload-drop-image-"+card).hide();
			        $("#temporary-upload-drop-image-"+card).hide();
			        $(".uploaded-preview-image-"+card).hide();	    			        
			        $("#rmImg-"+card).show();
			        $("#rotateImg-"+card).show();
			        $("#desrotateImg-"+card).show();
			        $('.warning').hide();
			        $(".remove-img-"+card).hide();
			        $("#hide-image-"+card).val('0');
 			        break;
 			      case "47494638":
 			        type = "image/gif";
 			        $("#imgPreview-"+card).show();
			        $("#upload-drop-image-"+card).hide();
			        $("#temporary-upload-drop-image-"+card).hide();
			        $(".uploaded-preview-image-"+card).hide();
			        $("#rmImg-"+card).show();
			        $("#rotateImg-"+card).show();
			        $("#desrotateImg-"+card).show();
			        $('.warning').hide();
			        $(".remove-img-"+card).hide();
			        $("#hide-image-"+card).val('0');
 			        break;
 			      case "ffd8ffe0":
 			      case "ffd8ffe1":
 			      case "ffd8ffe2":
 			        type = "image/jpeg";
 			        $("#imgPreview-"+card).show();
			        $("#upload-drop-image-"+card).hide();
			        $("#temporary-upload-drop-image-"+card).hide();
			        $(".uploaded-preview-image-"+card).hide();
			        $("#rmImg-"+card).show();
			        $("#rotateImg-"+card).show();
			        $("#desrotateImg-"+card).show();
			        $('.warning').hide();
			        $(".remove-img-"+card).hide();
			        $("#hide-image-"+card).val('0');
 			        break;
 			      default:
 			        type = "unknown";    			        
 			        $("#imgPreview-"+card).hide();
 			        $("#upload-drop-image-"+card).show();
 			        $(".uploaded-preview-image-"+card).show();
 			        $("#rmImg-"+card).hide();
 			        $("#rotateImg-"+card).hide();
 			        $("#desrotateImg-"+card).hide();
 			        $("#file-"+card).val("");
 			        $('.warning').remove();
 			        var newParagraph = document.createElement("p");
 			        newParagraph.innerHTML = "<span class='warning title-tip'><br/><br/>File is not an image</span>";
 			        $(".upload-area-"+card).append(newParagraph);
 			        break;
 			    }
 			    return type;
 			  }

 			  function printHeaderInfo(url, headerString) {
 			    $("hr").after($("#imgInfo-"+card).text("Real MIME type: " + mimeType(headerString)))
 			      .after($("#imgInfo-"+card).text("File header: 0x" + headerString))
 			      .after($("#imgInfo-"+card).text(url));
 			  }

 			  /* Demo driver code */
		  
 			  var imageURLsArray = [];
 			 
 			  // Check for FileReader support
 			  if (window.FileReader && window.Blob) {
 			    // Load all the remote images from the urls array
 			    for (var i = 0; i < imageURLsArray.length; i++) {
 			      getRemoteFileHeader(imageURLsArray[i], remoteCallback);
 			    }

 			    /* Handle local files */
 			    $("#file-"+card).on('change', function(event) {
 			      var file = event.target.files[0];
 			      var card = $(this).data("id");
 			      $("#direction-"+card).val('0'); //set image to landscape without click on desrotate
 			      if (file.size >= 4 * 1024 * 1024) {
 			        $("#imgPreview-"+card).hide();
 			        $("#rmImg-"+card).hide();
 			        $("#upload-drop-image-"+card).show();
 			        $("#temporary-upload-drop-image-"+card).hide();
 			        $(".uploaded-preview-image-"+card).show();
 			        $("#file-"+card).val("");
 			        $("#warningClickUpload-"+card).hide();
 			        $('.warning').remove(); 			       
 			        var newParagraph = document.createElement("p");
 			        newParagraph.innerHTML = "<span class='warning title-tip'><br/><br/>File size must be at most 4MB</span>";
 			        $(".upload-area-"+card).append(newParagraph);
 			        //$("#warningNotImage-"+card).hide();
 			        //$("#warningNotImage-"+card).remove();
 			        //$('<span id="warningNotImage-"'+card+'" class="title-tip">File size must be at most 4MB</span>').appendTo('.fr-image-upload-layer-'+card);
 			        return;
 			      }
 			      remoteCallback(escape(file.name), file);
 			    });

 			  } else {
 			    // File and Blob are not supported
 			    $("hr").after( $("<div>").text("It seems your browser doesn't support FileReader") );
 			  } /* Drakes, 2015 */
 			  
 			  $("#rmImg-"+card).on('click', function(event) {
 				  var card = $(this).data("id");
 				  $("#file-"+card).val("");
 				  $("#imgPreview-"+card).hide();
 				  $("#upload-drop-image-"+card).show();
 				  $(".uploaded-preview-image-"+card).show();
 				  $(this).hide();
 				  $("#rotateImg-"+card).hide();
		          $("#desrotateImg-"+card).hide();
		          $(".remove-img-"+card).show();
		          if ($.trim($('#edit_content_'+card).val()).length < 1 && $("#upload-drop-image-"+card).is(':visible')) {
			      	  $(':input[type="submit"]').prop('disabled', true);
			      }
 			  });	
 			  
 			  $("#rotateImg-"+card).on('mouseover', function(event) {
				  var card = $(this).data("id");
				  var value = 0
				  $("#rotateImg-"+card).rotate({
				    bind:
				    {
				      click: function(){
				        value =90;
				        $(".imgpreview-"+card).rotate({ animateTo:value});
				        $("#direction-"+card).val('1');
				      }
				    }
				  });
				});
				$("#desrotateImg-"+card).on('mouseover', function(event) {
					  var card = $(this).data("id");
					  var value = 0
					  $("#desrotateImg-"+card).rotate({
					    bind:
					    {
					      click: function(){
					        value =0;
					        $(".imgpreview-"+card).rotate({ animateTo:value});
					        $("#direction-"+card).val('0');
					      }
					    }
					  });
				});	
				$(".remove-img-"+card).on('click',function(){
					self = $(this);
			    	var card = $(this).data("id");
	            	  $("#file-"+card).val("");
	 				  $("#imgPreview-"+card).hide();
	 				  $("#temporary-upload-drop-image-"+card).show(); //show default upload image
	 				  $(".uploaded-preview-image-"+card).hide(); //hide uploaded image in database
	 				  $(".warning").hide(); //hide file size warning
	 				  $("#rotateImg-"+card).hide(); //hide icon to rotate image to right
			          $("#desrotateImg-"+card).hide(); //hide icon to rotate image to left
			          $(".remove-img-"+card).hide(); //hide remove button
			          $("#hide-image-"+card).val('1'); //set field to hide image
			          if ($.trim($('#edit_content_'+card).val()).length < 1 && ($("#upload-drop-image-"+card).is(':visible') || $("#temporary-upload-drop-image-"+card).is(':visible'))) {
				      	  $(':input[type="submit"]').prop('disabled', true);
				      }
				});
	    //##########################################################################
    });
});
</script>

<script>
$(document).ready(function () {
function setSelectionRange(input, selectionStart, selectionEnd) {
	  if (input.setSelectionRange) {
	    input.focus();
	    input.setSelectionRange(selectionStart, selectionEnd);
	  } else if (input.createTextRange) {
	    var range = input.createTextRange();
	    range.collapse(true);
	    range.moveEnd('character', selectionEnd);
	    range.moveStart('character', selectionStart);
	    range.select();
	  }
	}

	function setCaretToPos(input, pos) {
	  setSelectionRange(input, pos, pos);
	}
	
		$(".edit-card-text-field").click(function() {
		  if ($.trim($('.edit_content').val()).length < 1) {
		  	setCaretToPos($(".edit_content")[0], 0)
		  }
		});
});
</script>

<script>
$(document).ready(function () {
	jQuery(document).ready(function($) {
        $('.edit_content').keyup(function(event) {
            var textBox = event.target;
            var start = textBox.selectionStart;
            var end = textBox.selectionEnd;
            textBox.value = textBox.value.charAt(0).toUpperCase() + textBox.value.slice(1);
            textBox.setSelectionRange(start, end);
        });
    });
});
</script>

<script>
$( document ).ready(function() {
$("#cardupload-{{tip.id}}").submit(function(event){
    event.preventDefault(); //prevent default action
    var wasabooref = "{{url}}";  
    var tip = $(this).data("id"); 
    var post_url = $(this).attr("action"); //get form action url
    var request_method = $(this).attr("method"); //get form GET/POST method
    var form_data = new FormData(this); //Encode form elements for submission
    
    $('.btn-cancel-{{tip.id}}').prop('disabled', true);
    $('#submit-{{tip.id}}').prop('disabled', true);
    $('#submit-{{tip.id}}').val('Editing...');  
    $('.dot-'+tip).animate({"animation-duration":"1.3s"}, 0);
    $.ajax({
    	url : post_url,
        type: request_method,
        data : form_data,
        dataType : 'html',
        contentType: false,
        processData: false,
        success: function(response) {          	
        	location.reload();
        	
            // CLOSE MODAL	   
        	$('body').removeClass('modal-open');
        	$('.modal-backdrop').remove();
        	$('.btn-cancel').prop('disabled', false);
        	$(':input[type="submit"]').prop('disabled', false);
        	$(':input[type="submit"]').val('Publish');
        	$('.close').click();
        }
    });
});
});
</script>
