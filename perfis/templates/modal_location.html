<!-- New Company Location Form -->
<div class="modal fade" id="newLocation" tabindex="-1" role="dialog" 
     aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
          		<span class="profile-name profile-title" id="myModalLabel">
               	   Add a location
                </span>
                <button type="button" class="close" data-dismiss="modal">
                       <span aria-hidden="true">&times;</span>
                       <span class="sr-only">Close</span>
                </button>
            </div>
            
            <div class="modal-body">
			
			<form  id="new_location_form" action="{%url 'new_location' perfil_logado.id %}" method="post">
			{% csrf_token %}
 			  	  
 			  	  <input type="hidden" value="{{user.id}}" id="location_user_id" 
 			  	  name="location_user_id" required="required">
 			  	  
	 			  <input type="hidden" value="{{perfil_logado.id}}" id="location_profile_id" 
	 			  name="location_profile_id" required="required">
	 			  
	 			  <div class="row">
					<div class="col-md-10 col-sm-10 col-xs-10">
						<div class="panel panel-default-map">
							<div class="map-body">
								<div class="input-group stylish-input-group-on-maps dimension">
									<input id="address" name="address" type="text" class="form-control" 
									placeholder="Enter the address" required="required"/>
									<span class="input-group-addon" style="background: #fff !important;">
					                    <button class="btn btn-primary btn-sm btn-info" id="get-map-btn">
										    <span class="glyphicon glyphicon-map-marker"></span>
									    </button>
					            	</span>
				            	</div>
								<div id="map-canvas" style="min-height: 400px;"></div>
							</div>
						</div>
					</div>					
				  </div>

	 			  <input id="date" name="date" type="hidden"  value="{% now 'd/m/Y HH:mm:ss' %}" 
	 			  required="required">
	 			  
	 			  <br/>
	 			  
	 			  <div class="modal-header">
				  <button type="button" class="btn btn-cancel" data-dismiss="modal">Close</button>
				  <input class="btn btn-info" type="submit" value="Publish" disabled/>
				  </div>
			</form>
							  
				  <script>
				  $(document).ready(function () {
					    $('#address').keyup(function () {
					        if ($.trim($('#address').val()).length < 1) {

					        	$(':input[type="submit"]').prop('disabled', true);

					        } else {

					        	$(':input[type="submit"]').prop('disabled', false);

					        }
					    });
					});
		          </script>	
		          
            </div>
        </div>  
    </div>
</div>	
<!-- End form -->

<!-- AJAX NEW COMPANY FORM SUBMIT -->
<script>
$( document ).ready(function() {
$("#new_location_form").submit(function(event){
    event.preventDefault(); //prevent default action
    var wasabooref = "{{url}}";   
    var tip = $(this).data("id"); 
    var post_url = $(this).attr("action"); //get form action url
    var request_method = $(this).attr("method"); //get form GET/POST method
    var form_data = new FormData(this); //Encode form elements for submission
    
    $(':input[type="submit"]').prop('disabled', true);
    
    $.ajax({
    	url : post_url,
        type: request_method,
        data : form_data,
        dataType : 'html',
        contentType: false,
        processData: false,
        success: function(response) { //on success
        	//LOAD SCRIPTS WITHOUT AJAX CALLS
        	$.getScript( '/static/js/scripts-loader.js');
        	
            // AJAX CALLS
        	$.getScript( '/static/js/show-references.js');
        	$.getScript( '/static/js/show-back.js');
        	$.getScript( '/static/js/favoriting-card.js');
        	$.getScript( '/static/js/desfavoriting-card.js');
        	$.getScript( '/static/js/hide-card.js');
        	$.getScript( '/static/js/publish-card.js');
        	$.getScript( '/static/js/counting-favoritings.js');
        	$.getScript( '/static/js/who-favorited.js');
        	$.getScript( '/static/js/delete-card-btn-yes.js');
        	$.getScript( '/static/js/save-to-folder.js');
        	$.getScript( '/static/js/delete-from-folder.js');
        	$.getScript( '/static/js/jquery.jscroll.js');
        	$.getScript( '/static/js/delete-location.js');
        	
        	// LOAD HTML
        	$('.profile-waterfall').html(jQuery(response).find('.profile-waterfall').html());
        	
        	// CLOSE MODAL
        	$('.close').click();
        	$('body').removeClass('modal-open');
        	$('.modal-backdrop').remove();	        	
        }
    });
});
});
</script>
