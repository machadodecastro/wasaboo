<!-- Tip Form -->
<div class="modal fade" id="updateJobs-{{c.id}}" tabindex="-1" role="dialog" 
     aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
            	<span class="profile-name profile-title" id="myModalLabel">
               	   Edit employment
                </span>
                <button type="button" class="close" data-dismiss="modal">
                       <span aria-hidden="true">&times;</span>
                       <span class="sr-only">Close</span>
                </button>
            </div>
            
            <div class="modal-body">
			
			<form id="update_job_form_{{c.id}}" action="{%url 'update_jobs' c.id %}" method="post">
			{% csrf_token %}
				  <input type="hidden" value="{{c.id}}" id="edit_idTip" class="idTip">
 			  	  
 			  	  <input type="hidden" value="{{user.id}}" id="jobs_user_id" name="jobs_user_id" 
 			  	  required="required" class="jobs_user_id">
 			   
	 			  <input type="hidden" value="{{perfil_logado.id}}" id="jobs_profile_id" 
	 			  name="jobs_profile_id" required="required" class="jobs_profile_id">
	 			  
	 			  <span class="input_label">Company/Organization</span>
	 			  <input type="text" id="edit_company_{{c.id}}" name="company" required="required" 
	 			  class="profile-field-normal company" placeholder="Wasaboo..."
	 			  value="{{c.company}}">
	 			  
	 			  <br/><br/>
	 			  
				  <span class="input_label">Position</span>
	 			  <input type="text" id="edit_position_{{c.id}}" name="position" 
	 			  class="profile-field-normal position" placeholder="Bug tester..."
	 			  value="{{c.position}}">
	 			  
	 			  <br/><br/>	 			  
	 			  
				  <span class="input_label">Start Year</span>
				  <select id="edit_start_year_{{c.id}}" name="start_year" 
				  class="profile-field-normal profile-field-small">
				      <option selected class="start_year_{{c.id}}"></option>
				  </select>
				  
				  <br/><br/>
				  
				  <span class="input_label">End Year</span>
				  <select id="edit_end_year_{{c.id}}" name="end_year" 
				  class="profile-field-normal profile-field-small">
				  	  <option selected class="end_year_{{c.id}}"></option>
				  </select>
				  
				  <br/><br/>	
				  
				  <input type="checkbox" id="edit_status_work" name="status_work" class="status_work"
				 {% if c.status_work == '1' %}checked{% endif %}> I currently work here 			  
	 			  
	 			  <input id="edit_date" name="date" type="hidden"  value="{% now 'd/m/Y HH:mm:ss' %}" 
	 			  required="required" class="date">				  
				  
				  <br/><br/><br/><br/>
				  
				  <div class="modal-header">	
				  <button type="button" class="btn btn-default btn-cancel" data-dismiss="modal">Close</button>
				  <input class="btn btn-info btn-update-jobs-{{c.id}}" type="submit" value="Update" disabled/>
				  </div>
		    </form>	  
		    <script>
		    $(document).ready(function () {
		    	if ($.trim($('#edit_company_{{c.id}}').val()).length > 1) {
		    		$('.btn-update-jobs-{{c.id}}').prop('disabled', false);
		    	}
			    $('#edit_company_{{c.id}}').keyup(function () {
			        if ($.trim($('#edit_company_{{c.id}}').val()).length < 1) {

			        	$('.btn-update-jobs-{{c.id}}').prop('disabled', true);

			        } else {

			        	$('.btn-update-jobs-{{c.id}}').prop('disabled', false);

			        }
			    });
			});
            </script>	
   	      
   	        <script>
			$(document).ready(function () {
				jQuery(document).ready(function($) {
			        $('#edit_company_{{c.id}}').keyup(function(event) {
			            var textBox = event.target;
			            var start = textBox.selectionStart;
			            var end = textBox.selectionEnd;
			            textBox.value = textBox.value.charAt(0).toUpperCase() + textBox.value.slice(1);
			            textBox.setSelectionRange(start, end);
			        });
			    });
			});
		    </script>
		  
		    <script>
			$(document).ready(function () {
				jQuery(document).ready(function($) {
			        $('#edit_position_{{c.id}}').keyup(function(event) {
			            var textBox = event.target;
			            var start = textBox.selectionStart;
			            var end = textBox.selectionEnd;
			            textBox.value = textBox.value.charAt(0).toUpperCase() + textBox.value.slice(1);
			            textBox.setSelectionRange(start, end);
			        });
			    });
			});
		    </script>   	
                
            </div>
        </div>  
    </div>
</div>	
<!-- End form -->


<script>
  $(document).ready(function () {
	  var start_start_year = 1900;
	  var end_start_year = new Date().getFullYear();
	  var option_start_year ="";
	  var options_start_year = "";
	  for(var year_start_year = start_start_year ; year_start_year <= end_start_year; year_start_year++){
	     edit_start_year_option = "<option selected class='start_year_{{c.id}}' style='background-color:#93c4d3;color:#fff;'></option>";
	     option_start_year = "<option selected value='{{c.start_year}}' style='background-color:#93c4d3;color:#fff;'>{{c.start_year}}</option>";
	     options_start_year += "<option>"+ year_start_year +"</option>";
	  }
	  document.getElementById("edit_start_year_{{c.id}}").innerHTML = option_start_year + options_start_year;

  });
</script>


<script>
  $(document).ready(function () {
	  var start_end_year = 1900;
	  var end_end_year = new Date().getFullYear();
	  var option_end_year ="";
	  var options_end_year = "";
	  for(var year_end_year = start_end_year ; year_end_year <= end_end_year; year_end_year++){
	     edit_end_year_option = "<option selected class='end_year_{{c.id}}' style='background-color:#93c4d3;color:#fff;'></option>";
	     option_end_year = "<option selected value='{{c.end_year}}' style='background-color:#93c4d3;color:#fff;'>{{c.end_year}}</option>";
	     options_end_year += "<option>"+ year_end_year +"</option>";
	  }
	  document.getElementById("edit_end_year_{{c.id}}").innerHTML = option_end_year + options_end_year;

  });
</script>


<!-- AJAX UPDATE COMPANY FORM SUBMIT -->
<script>
$( document ).ready(function() {
$("#update_job_form_{{c.id}}").submit(function(event){
    event.preventDefault(); //prevent default action
    var wasabooref = "{{url}}";   
    var tip = $(this).data("id"); 
    var post_url = $(this).attr("action"); //get form action url
    var request_method = $(this).attr("method"); //get form GET/POST method
    var form_data = new FormData(this); //Encode form elements for submission
    
    $(':input[type="submit"]').prop('disabled', true);
    
    $.ajax({
    	url : post_url,
        type: request_method,
        data : form_data,
        dataType : 'html',
        contentType: false,
        processData: false,
        success: function(response) { //on success
        	//LOAD SCRIPTS WITHOUT AJAX CALLS
        	$.getScript( '/static/js/scripts-loader.js');	        	
        	
            // AJAX CALLS
        	$.getScript( '/static/js/show-references.js');
        	$.getScript( '/static/js/show-back.js');
        	$.getScript( '/static/js/favoriting-card.js');
        	$.getScript( '/static/js/desfavoriting-card.js');
        	$.getScript( '/static/js/hide-card.js');
        	$.getScript( '/static/js/publish-card.js');
        	$.getScript( '/static/js/counting-favoritings.js');
        	$.getScript( '/static/js/who-favorited.js');
        	$.getScript( '/static/js/delete-card-btn-yes.js');
        	$.getScript( '/static/js/save-to-folder.js');
        	$.getScript( '/static/js/delete-from-folder.js');
        	$.getScript( '/static/js/jquery.jscroll.js');
        	$.getScript( '/static/js/delete-jobs.js');
        	
        	// LOAD HTML
        	$('.profile-waterfall').html(jQuery(response).find('.profile-waterfall').html());
        	
        	// CLOSE MODAL
        	$('.close').click();
        	$('body').removeClass('modal-open');
        	$('.modal-backdrop').remove();		     
        	$(':input[type="submit"]').prop('disabled', false);
        }
    });
});
});
</script>
