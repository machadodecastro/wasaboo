<!-- Modal for editing profile picture-->
<div class="modal fade" id="updateProfilePicture" tabindex="-1" role="dialog" 
     aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                       <span aria-hidden="true">&times;</span>
                       <span class="sr-only">Close</span>
                </button>
            </div>
            
            <div class="modal-body">
            <form id="formbase64-{{perfil_logado.id}}" method="post" enctype="multipart/form-data" 
            action="{%url 'new_profile_picture' a.id %}">
            {% csrf_token %}	 			  	  
	 			  	  <input type="hidden" value="{{request.user.id}}" id="avatar_user_id" 
	 			  	  name="user_id" required="required">
	 			   
		 			  <input type="hidden" value="{{perfil_logado.id}}" id="avatar_profile_id" 
		 			  name="profile_id" required="required">
		 			  
		 			  <input type="hidden" name="upload" class="upload-{{perfil_logado.id}}"/>
		 			  
				<div class="demo-wrap upload-demo">
                    <div class="container">
                    <div class="grid">
                        <div class="col-1-2">
                            <div class="actions">
                            	<button type="button" class="btn btn-default btn-cancel" data-dismiss="modal">Cancel</button>
                                
                                <a class="btn file-btn">
                                    <span>Upload</span>
                                    <input type="file" id="upload"  value="Choose a file" 
                                    accept="image/*" />
                                                                        
                                </a>
                                
  	                        </div>
  	                        
  	                        
  	                                                
	                        <div class="col-1-2">
	                            <div class="upload-msg">
	                                Upload an image to start cropping
	                            </div>
	                            <div class="upload-demo-wrap">
	                                <div id="upload-demo"></div>
	                            </div>
	                        </div>
	                        
	                        <button type="button" class="btn upload-result">Crop</button>
                    	</div>
                    	
                    	
                	</div>
                	</div>
               </div>	
            </form>			  
            </div>
        </div>  
    </div>
</div>	<!-- End tip form -->
