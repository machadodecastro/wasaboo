<!-- Card Update Form -->
<div class="modal fade" id="updateFolder-{{tip.id}}" tabindex="-1" role="dialog" 
     aria-labelledby="myModalLabel" aria-hidden="true" data-backdrop="static">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
            	<span class="title-tip" style="font-size:20px">Edit deck</span>
                
                <button type="button" class="close" data-dismiss="modal">
                       <span aria-hidden="true">&times;</span>
                       <span class="sr-only">Close</span>
                </button>
                
            </div>
            
            <div class="modal-body">
			<div class="modal-header">
			<form id="update_deck_form_{{tip.id}}" action="{%url 'update_deck' tip.id %}" method="post" 
			enctype="multipart/form-data">
			{% csrf_token %}

				  <input type="hidden" value="{{tip.id}}" id="idTip-{{tip.id}}" class="idTip">
 			  	  
 			  	  <input type="hidden" value="{{user.id}}" id="author_user_id-{{tip.id}}" name="author_user_id" required="required">
 			   
	 			  <input type="hidden" value="{{perfil_logado.id}}" id="author_profile_id-{{tip.id}}" name="author_profile_id" required="required">
	 			  
	 			  <input type="hidden" value="{{perfil_logado.nome}}" id="author_name-{{tip.id}}" name="author_name" required="required">
	 			  
	 			  <input id="date-{{tip.id}}" name="date" type="hidden"  value="{% now 'd/m/Y H:m:s' %}" required="required" readonly>
	 			  
	 			  <input type="text" id="deck_name_{{tip.id}}" name="deck_name" 
	 			  class="profile-field-normal" placeholder="Deck's name" value="{{tip.deck}}">
				  
				  <br/><br/><br/><br/>
						  
				<button type="button" class="btn btn-cancel" data-dismiss="modal">Close</button>
				<input class="btn btn-success" name="submit" type="submit" value="Update" id="submit-{{tip.id}}" disabled/>
				
				<script>
				  $(document).ready(function () {
					    $('#deck_name_{{tip.id}}').keyup(function () {
					        if ($.trim($('#deck_name_{{tip.id}}').val()).length < 1) {

					        	$(':input[type="submit"]').prop('disabled', true);

					        } else {

					        	$(':input[type="submit"]').prop('disabled', false);

					        }
					    });
					});
		          </script>	
				  <script>
					$(document).ready(function () {
						jQuery(document).ready(function($) {
					        $('#deck_name_{{tip.id}}').keyup(function(event) {
					            var textBox = event.target;
					            var start = textBox.selectionStart;
					            var end = textBox.selectionEnd;
					            textBox.value = textBox.value.charAt(0).toUpperCase() + textBox.value.slice(1);
					            textBox.setSelectionRange(start, end);
					        });
					    });
					});
				  </script>		          
			</form>
			</div>
			</div>
        </div>  
    </div>
</div>


<!-- AJAX UPDATE FOLDER FORM SUBMIT -->
<script>
$( document ).ready(function() {
$("#update_deck_form_{{tip.id}}").submit(function(event){
    event.preventDefault(); //prevent default action
    var wasabooref = "{{url}}";   
    var tip = $(this).data("id"); 
    var post_url = $(this).attr("action"); //get form action url
    var request_method = $(this).attr("method"); //get form GET/POST method
    var form_data = new FormData(this); //Encode form elements for submission
    
    $(':input[type="submit"]').prop('disabled', true);
    
    $.ajax({
    	url : post_url,
        type: request_method,
        data : form_data,
        dataType : 'html',
        contentType: false,
        processData: false,
        success: function(response) { //on success
        	//LOAD SCRIPTS WITHOUT AJAX CALLS
        	$.getScript( '/static/js/scripts-loader.js');
        	
            // AJAX CALLS
        	$.getScript( '/static/js/show-references.js');
        	$.getScript( '/static/js/show-back.js');
        	$.getScript( '/static/js/favoriting-card.js');
        	$.getScript( '/static/js/desfavoriting-card.js');
        	$.getScript( '/static/js/hide-card.js');
        	$.getScript( '/static/js/publish-card.js');
        	$.getScript( '/static/js/counting-favoritings.js');
        	$.getScript( '/static/js/who-favorited.js');
        	$.getScript( '/static/js/delete-card-btn-yes.js');
        	$.getScript( '/static/js/save-to-folder.js');
        	$.getScript( '/static/js/delete-from-folder.js');
        	$.getScript( '/static/js/jquery.jscroll.js');
        	$.getScript( '/static/js/folder-toolbar.js');
        	
        	// LOAD HTML
        	$('.profile-waterfall').html(jQuery(response).find('.profile-waterfall').html());
        	
        	// CLOSE MODAL
        	$('.close').click();
        	$('body').removeClass('modal-open');
        	$('.modal-backdrop').remove();	        	
        }
    });
});
});
</script>
