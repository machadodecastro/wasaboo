# mysite_nginx.conf

# the upstream component nginx needs to connect to
upstream django {
    # server unix:///path/to/your/mysite/mysite.sock; # for a file socket
    server 127.0.0.1:8001; # for a web port socket (we'll use this first)
}

# configuration of the server
server {
    # the port your site will be served on
    listen      80;
    # the domain name it will serve for
    # server_name 35.231.59.27; # substitute your machine's IP address or FQDN
    server_name wasaboo.com;
    return 301 https://www.wasaboo.com$request_uri;

    root /opt/myenv/wasaboo;
    charset     utf-8;

    # max upload size
    client_max_body_size 75M;   # adjust to taste 

    # Django media
    location /media  {
        alias /opt/myenv/wasaboo/media;  # your Django project's media files - amend as required
    }

    location /static {
        alias /opt/myenv/wasaboo/static; # your Django project's static files - amend as required
    }

    # Finally, send all non-media requests to the Django server.
    location / {
        #uwsgi_pass  django;
        #include     /opt/myenv/wasaboo/uwsgi_params; # the uwsgi_params file you installed
		proxy_pass_header Server;
		proxy_set_header Host $http_host;
		proxy_redirect off;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Scheme $scheme;
		proxy_connect_timeout 300;
		proxy_read_timeout 300;
		proxy_pass http://127.0.0.1:8001;		   
      }		
}

